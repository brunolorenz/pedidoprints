<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1814">
<title>Pedido · Uns Predinhos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap');
:root{--cream:#f7f3ec;--white:#fff;--ink:#1c1814;--mid:#6f655b;--rule:#d9d0c4;--accent:#b8421c;--accent-bg:#fdf0eb;--accent-border:#e0b4a2;--green:#2a6049;--green-bg:#eaf3ee;--green-border:#b8d9c8;--tag-bg:#f0e5d0;--tag-ink:#7a5c20;--danger:#9b2c2c;--serif:'Instrument Serif',Georgia,serif;--sans:'Instrument Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--cream);overscroll-behavior:none;overflow-x:hidden}
body{font-family:var(--sans);color:var(--ink);min-height:100dvh;padding-bottom:110px;overflow-x:hidden;font-size:15px}
@media(min-width:600px){body{max-width:520px;margin:0 auto;border-left:1px solid var(--rule);border-right:1px solid var(--rule);min-height:100vh}}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hide{display:none!important}

/* topo */
.topo{position:sticky;top:0;z-index:200;background:var(--ink);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between}
.topo-logo{font-family:var(--serif);font-size:20px;font-style:italic}
.topo-meta{text-align:right;display:flex;flex-direction:column;gap:2px}
.topo-data{font-size:12px;color:rgba(255,255,255,.75)}
.topo-contador{font-size:12px;font-weight:500;display:none}
.topo-contador strong{color:#f4a383}

/* blocos e campos */
.bloco{background:var(--white);border-bottom:1px solid var(--rule);padding:14px 16px}
.rotulo{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);margin-bottom:6px}
.rotulo.acento{color:var(--accent);font-weight:600;margin-top:4px}
.campo{width:100%;padding:11px 12px;background:var(--cream);border:1px solid var(--rule);border-radius:8px;font-size:15px;outline:none;-webkit-appearance:none;appearance:none}
.campo:focus{border-color:var(--accent);background:#fff}
.campo-nome{font-family:var(--serif);font-style:italic;font-size:22px;background:transparent;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:4px 0}
.campo-nome:focus{border-bottom-color:var(--accent);background:transparent}
.campo::placeholder{color:var(--mid);opacity:.85}
.linha-acoes{display:flex;gap:8px;margin-top:14px}
.linha-acoes .btn-sec{flex:1}
.acoes{display:flex;gap:8px;flex-wrap:wrap}

/* seções */
.secao{padding:16px 16px 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);display:flex;justify-content:space-between;align-items:center}
.lista{display:flex;flex-direction:column;background:var(--white);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.vazio-lista{padding:20px 16px;color:var(--mid);text-align:center;background:#fff}

/* cards (artes e posters) */
.arte-card{border-bottom:1px solid var(--rule);background:var(--white);position:relative}
.arte-card:last-child{border-bottom:0}
.arte-trigger{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;min-height:60px;border-left:3px solid transparent}
.arte-trigger:active{background:#f5ede8}
.arte-card.preenchida .arte-trigger{border-left-color:var(--green)}
.arte-card.aberta .arte-trigger{background:var(--accent-bg);border-left-color:var(--accent)}
.trig-esq{display:flex;flex-direction:column;gap:3px;min-width:0}
.arte-nome{font-size:15px;font-weight:500;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pill,.badge{font-size:11px;padding:2px 7px;border-radius:10px;font-weight:400}
.pill{color:var(--mid);background:var(--cream);border:1px solid var(--rule)}
.badge{background:var(--tag-bg);color:var(--tag-ink);border:1px solid #d4b8ae}
.arte-resumo{font-size:13px;color:var(--mid)}
.arte-resumo .qtd{color:var(--green);font-weight:600}
.arte-resumo .aviso{color:var(--accent);font-weight:500}
.trig-dir{display:flex;align-items:center;gap:8px;flex-shrink:0}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.arte-card.preenchida .check{background:var(--green);border-color:var(--green)}
.seta{color:var(--mid);transition:transform .2s}
.aberta .seta{transform:rotate(180deg)}
.arte-editor{display:none;padding:4px 14px 16px;background:var(--accent-bg);border-top:1px solid var(--accent-border);flex-direction:column;gap:12px}
.aberta .arte-editor{display:flex}

/* quantidades */
.qtd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.qtd-lbl{font-size:11px;letter-spacing:.08em;color:var(--accent);font-weight:600;display:block;margin-bottom:4px}
.stepper{display:flex;align-items:center;background:#fff;border:1.5px solid var(--accent-border);border-radius:10px;overflow:hidden}
.step-btn{flex:0 0 38px;height:44px;font-size:20px;color:var(--accent);display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.step-btn:active{background:var(--accent-bg)}
.step-val{flex:1;min-width:0;width:100%;height:44px;border:0;background:transparent;text-align:center;font-size:16px;font-weight:600;outline:none;-moz-appearance:textfield;appearance:textfield}
.step-val::-webkit-inner-spin-button,.step-val::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* uso único */
.switch-linha{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1.5px solid var(--accent-border);border-radius:8px}
.uso-lbl{display:block;font-size:14px}
.uso-sub{display:block;font-size:12px;color:var(--mid);margin-top:2px}
.switch{width:44px;height:26px;background:var(--rule);border-radius:13px;position:relative;flex-shrink:0;transition:background .2s}
.switch.on{background:var(--accent)}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.switch.on::after{left:21px}
.uu{display:flex;flex-direction:column;gap:8px;background:var(--tag-bg);border:1px solid #d4b8ae;border-radius:8px;padding:12px}
.uu label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tag-ink);display:block;margin-bottom:4px}

/* botões */
.btn-primario{flex:1;min-width:120px;padding:14px;background:var(--accent);color:#fff;border-radius:8px;font-weight:600;text-align:center}
.btn-primario:disabled{opacity:.45}
.btn-primario:active{opacity:.85}
.btn-sec{padding:12px 14px;border:1.5px solid var(--accent-border);border-radius:8px;font-size:14px;color:var(--ink);background:#fff;text-align:center}
.btn-sec:active{background:var(--cream)}
.btn-sec.perigo{color:var(--danger)}
.dashed{display:flex;align-items:center;gap:10px;width:calc(100% - 32px);margin:12px 16px;padding:14px 16px;background:#fff;border:1.5px dashed #bfb4a6;border-radius:12px;color:var(--mid);font-size:14px}

/* posters */
.mes-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mes-btn{padding:10px 4px;background:#fff;border:1.5px solid var(--accent-border);border-radius:8px;font-size:13px;text-align:center}
.mes-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.variante-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.var-btn{padding:12px 8px;background:#fff;border:1.5px solid var(--accent-border);border-radius:8px;text-align:center;font-weight:500;display:flex;flex-direction:column;gap:3px;align-items:center}
.var-btn small{font-size:12px;color:var(--mid);font-weight:400}
.var-btn[aria-pressed="true"]{border-color:var(--green);background:var(--green-bg)}

/* nova arte */
.nova-form{display:none;flex-direction:column;gap:10px;margin:12px 16px;padding:14px;background:#fff;border:1px solid var(--rule);border-radius:12px}
.nova-form.aberta{display:flex}

/* totais */
.totais{margin:16px 16px 0;background:#fff;border:1px solid var(--rule);border-radius:12px;overflow:hidden;display:none}
.totais.visivel{display:block}
.totais-titulo{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);padding:10px 16px 6px;border-bottom:1px solid var(--rule)}
.totais-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.tc{display:flex;flex-direction:column;align-items:center;padding:12px 2px;border-right:1px solid var(--rule);gap:3px}
.tc:last-child{border-right:0}
.tc .n{font-family:var(--serif);font-size:24px;line-height:1;color:var(--accent)}
.tc .l{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mid)}
.tc.total .n{color:var(--ink)}

/* botão flutuante */
.fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:300;background:var(--ink);color:#fff;border-radius:30px;padding:16px 28px;font-weight:600;box-shadow:0 4px 20px rgba(28,24,20,.35);opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.fab.visivel{opacity:1;pointer-events:auto}

/* revisão (folha inferior) */
dialog{border:0;border-radius:16px 16px 0 0;padding:0;width:min(520px,100%);margin:auto auto 0;background:var(--cream);color:var(--ink);max-height:88dvh}
dialog::backdrop{background:rgba(28,24,20,.5)}
.dlg{padding:18px 16px 24px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.dlg h2{font-family:var(--serif);font-weight:400;font-size:26px}
.msg{white-space:pre-wrap;background:#fff;border:1px solid var(--rule);border-radius:10px;padding:12px;font-family:var(--sans);font-size:13px;line-height:1.45;max-height:40dvh;overflow:auto}
.erros{background:var(--accent-bg);border:1px solid var(--accent-border);border-radius:10px;padding:12px 14px;color:var(--danger);font-size:14px}
.erros ul{padding-left:18px}
.erros li{margin:3px 0}
</style>
</head>
<body>
<style>
.gaveta{margin-top:14px}
.gaveta>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mid)}
.gaveta>summary::-webkit-details-marker{display:none}
.gaveta>summary::after{content:'▾';margin-left:8px;transition:transform .2s}
.gaveta[open]>summary::after{transform:rotate(180deg)}
.custo-linha{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--rule);font-size:14px}
.custo-linha strong{font-family:var(--serif);font-weight:400;font-size:24px;color:var(--ink)}
.custo-nota{font-size:12px;color:var(--mid);padding:0 16px 12px}
.arte-editor .custo-nota{padding:0}
.custo{font-weight:500;color:var(--ink)}
</style>

<header class="topo">
  <div class="topo-logo">Uns Predinhos</div>
  <div class="topo-meta">
    <div class="topo-data" id="topo-data"></div>
    <div class="topo-contador" id="topo-contador" aria-live="polite"></div>
  </div>
</header>

<section class="bloco">
  <label class="rotulo" for="nome-pedido">Nome do pedido</label>
  <input class="campo campo-nome" id="nome-pedido" type="text" autocomplete="off" spellcheck="false">
  <div class="linha-acoes">
    <button class="btn-sec hide" id="btn-repetir" data-acao="repetir">Repetir último pedido</button>
    <button class="btn-sec" data-acao="novo">Novo pedido</button>
  </div>
</section>

<div class="secao"><span>Pedidos únicos</span><span id="contagem-unicas"></span></div>
<div class="lista" id="lista-unicas"></div>

<button class="dashed" data-acao="nova-abrir">＋ Nova arte (pedido único)</button>
<div class="nova-form" id="nova-form">
  <div>
    <label class="rotulo" for="nova-nome">Nome da arte</label>
    <input class="campo" id="nova-nome" type="text" placeholder="ex: Mercado Público" autocomplete="off">
  </div>
  <div>
    <label class="rotulo" for="nova-versao">Versão</label>
    <input class="campo" id="nova-versao" type="text" placeholder="A" style="max-width:100px" autocomplete="off">
  </div>
  <div class="acoes">
    <button class="btn-primario" data-acao="nova-confirmar">Adicionar</button>
    <button class="btn-sec" data-acao="nova-cancelar">Cancelar</button>
  </div>
</div>

<details class="gaveta" id="gaveta">
  <summary><span>Artes padrão</span><span id="contagem-padrao"></span></summary>
  <div class="bloco" style="padding:10px 16px;border-bottom:0">
    <input class="campo" id="busca" type="search" placeholder="Buscar arte…" autocomplete="off">
  </div>
  <div class="lista" id="lista-padrao"></div>
</details>

<div class="secao" style="margin-top:14px"><span>Posters · Predinho do Dia</span></div>
<div class="lista" id="lista-posters"></div>
<button class="dashed" data-acao="poster-novo">＋ Adicionar poster</button>

<div class="totais" id="totais">
  <div class="totais-titulo">Totais do pedido</div>
  <div class="totais-grid">
    <div class="tc"><span class="n" id="tot-a6">0</span><span class="l">A6</span></div>
    <div class="tc"><span class="n" id="tot-a5">0</span><span class="l">A5</span></div>
    <div class="tc"><span class="n" id="tot-a4">0</span><span class="l">A4</span></div>
    <div class="tc"><span class="n" id="tot-a3">0</span><span class="l">A3</span></div>
    <div class="tc"><span class="n" id="tot-a2">0</span><span class="l">A2</span></div>
    <div class="tc"><span class="n" id="tot-a1">0</span><span class="l">A1</span></div>
    <div class="tc total"><span class="n" id="tot-total">0</span><span class="l">Total</span></div>
  </div>
  <div class="custo-linha"><span>Custo estimado (fornecedor)</span><strong id="tot-custo">R$ 0,00</strong></div>
  <div class="custo-nota" id="custo-nota"></div>
</div>

<div style="height:16px"></div>
<button class="fab" id="fab" data-acao="revisar">Revisar e enviar ↗</button>

<dialog id="revisao">
  <div class="dlg">
    <h2>Revisar pedido</h2>
    <div class="erros hide" id="erros"></div>
    <pre class="msg" id="msg"></pre>
    <div class="acoes">
      <button class="btn-primario" id="btn-enviar" data-acao="enviar">Enviar pelo WhatsApp ↗</button>
      <button class="btn-sec" data-acao="copiar">Copiar texto</button>
    </div>
    <button class="btn-sec" data-acao="fechar-revisao">Voltar e editar</button>
  </div>
</dialog>

<script>
/* ── dados ── */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtBRL = v => v.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
const PAPEIS = ['Canson Matte 200g', 'Hahnemühle Photo Rag 308g'];
// Tabela do fornecedor, em R$ por print. Cada tamanho custa o dobro do menor (área dobra).
// A5 = A4 / 2 e A6 = A4 / 4, pela mesma proporção.
const TABELA = {
  'Canson Matte 200g': {a4: 30, a3: 60, a2: 120, a1: 240},
  'Hahnemühle Photo Rag 308g': {a4: 60, a3: 120, a2: 240, a1: 480}
};
const PRECOS = Object.fromEntries(Object.entries(TABELA).map(([papel, t]) =>
  [papel, {a6: t.a4 / 4, a5: t.a4 / 2, ...t}]));
const TAM = ['a6','a5','a4','a3','a2'];
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MESES_LONGOS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const BASE = [['CCMQ','A'],['CCMQ','C'],['CCMQ','D'],['Borges','A'],['Jóia','A'],['Mercado','A'],['Capitólio','A'],['Cabaret','A'],['Rocco','A'],['CAFF','A'],['Elaguante','A'],['HPS','A'],['Travessa V.','A'],['Vista PoA','A'],['Iberê','A'],['Iberê','B'],['Catedral','A'],['Beco dos Livros','A'],['Laçador','A'],['Agulha','A'],['Planetário','A'],['Beira Rio','A'],['Gasômetro','A'],['Olímpico','A'],['Orla','A'],['MTST','A']];
const STORE = 'uns-predinhos-pedido-v3';
const WA = '5551994791919';

/* ── estado ── */
// Artes com novaArte = pedidos únicos (topo da página). As demais são artes padrão (gaveta).
// est[id].papel: '' = sem papel | nome do papel | '__outro' (texto em papelTexto)
function novoPedido(artes) {
  return {
    nome: '', est: {}, posters: [], ultimo: null,
    artes: artes || BASE.map((v, i) => ({id: 'b' + i, nome: v[0], versao: v[1]})),
    aberto: null, posterAberto: null, filtro: ''
  };
}
function carregar() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (d && Array.isArray(d.artes)) return {...novoPedido(d.artes), ...d};
  } catch (_) {}
  return novoPedido();
}
let S = carregar();

const vazio = () => ({a6:0,a5:0,a4:0,a3:0,a2:0,papel:'',papelTexto:'',usoUnico:false,clienteNome:'',clienteArquivo:'',clienteLink:''});
const estDe = id => S.est[id] || (S.est[id] = vazio());
const qtdArte = x => TAM.reduce((s, t) => s + (x[t] || 0), 0);
const qtdPoster = p => (p.a3 || 0) + (p.a2 || 0) + (p.a1 || 0);
const getPoster = id => S.posters.find(p => String(p.id) === String(id));
const papelDe = x => x.papel === '__outro' ? (x.papelTexto || '').trim() : (x.papel || '');
function salvar() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (_) {} }

/* ── custo (tabela do fornecedor) ── */
function custoDe(papel, qtds) {
  const tab = PRECOS[papel];
  let valor = 0, semPreco = 0;
  Object.entries(qtds).forEach(([tam, q]) => {
    if (!q) return;
    const preco = tab && tab[tam];
    if (preco) valor += preco * q; else semPreco += q;
  });
  return {valor, semPreco};
}
const custoArte = x => custoDe(papelDe(x), {a6: x.a6, a5: x.a5, a4: x.a4, a3: x.a3, a2: x.a2});
const custoPoster = p => custoDe(p.papel, {a3: p.a3 || 0, a2: p.a2 || 0, a1: p.a1 || 0});
function textoCusto(c, q) {
  if (!q) return '';
  if (!c.valor && c.semPreco) return 'Sem preço na tabela para este papel ou tamanho.';
  return `Custo estimado: ${fmtBRL(c.valor)}` + (c.semPreco ? ` · ${c.semPreco} sem preço` : '');
}

/* ── cálculo geral (uma só fonte para tela, custo e mensagem) ── */
function calcular() {
  const t = {a6:0,a5:0,a4:0,a3:0,a2:0,a1:0};
  let valor = 0, semPreco = 0;
  S.artes.forEach(a => {
    const x = estDe(a.id);
    TAM.forEach(k => t[k] += x[k] || 0);
    const c = custoArte(x); valor += c.valor; semPreco += c.semPreco;
  });
  S.posters.forEach(p => {
    ['a3','a2','a1'].forEach(k => t[k] += p[k] || 0);
    const c = custoPoster(p); valor += c.valor; semPreco += c.semPreco;
  });
  const itens = S.artes.filter(a => qtdArte(estDe(a.id)) > 0).length
              + S.posters.filter(p => qtdPoster(p) > 0).length;
  const total = Object.values(t).reduce((a, b) => a + b, 0);
  return {t, total, itens, custo: {valor, semPreco}};
}

/* ── HTML: artes ── */
function htmlTrigger(a, x) {
  const q = qtdArte(x);
  const partes = TAM.filter(t => x[t]).map(t => `${x[t]}×${t.toUpperCase()}`).join(' · ');
  const papel = papelDe(x);
  const c = custoArte(x);
  let resumo;
  if (!q) resumo = '<span>Toque para preencher</span>';
  else resumo = `<span class="qtd">${partes}</span>`
    + (papel ? ` · ${esc(papel)}` : ' · <span class="aviso">falta papel</span>')
    + (c.valor ? ` · <span class="custo">${fmtBRL(c.valor)}</span>` : '');
  return `<span class="trig-esq">
      <span class="arte-nome">${esc(a.nome)} <span class="pill">${esc(a.versao)}</span>${x.usoUnico ? ' <span class="badge">uso único</span>' : ''}</span>
      <span class="arte-resumo">${resumo}</span>
    </span>
    <span class="trig-dir"><span class="check">${q ? '✓' : ''}</span><span class="seta" aria-hidden="true">▾</span></span>`;
}
function stepper(ctx, id, t, v) {
  const T = t.toUpperCase();
  const attrs = `data-ctx="${ctx}" data-id="${esc(id)}" data-t="${t}"`;
  return `<div>
    <span class="qtd-lbl">${T}</span>
    <div class="stepper">
      <button class="step-btn" data-passo="-1" ${attrs} aria-label="Diminuir ${T}">−</button>
      <input class="step-val" type="number" inputmode="numeric" min="0" value="${v || 0}" data-qtd ${attrs} aria-label="Quantidade ${T}">
      <button class="step-btn" data-passo="1" ${attrs} aria-label="Aumentar ${T}">+</button>
    </div>
  </div>`;
}
function opcoesPapel(atual, comOutro) {
  let h = `<option value="" ${!atual ? 'selected' : ''}>Escolher papel…</option>`;
  h += PAPEIS.map(p => `<option value="${esc(p)}" ${atual === p ? 'selected' : ''}>${esc(p)}</option>`).join('');
  if (comOutro) h += `<option value="__outro" ${atual === '__outro' ? 'selected' : ''}>Outro…</option>`;
  return h;
}
function campoUU(label, f, x, ph, tipo, id) {
  return `<div><label for="uu-${f}-${id}">${label}</label>
    <input class="campo" id="uu-${f}-${id}" type="${tipo}" placeholder="${esc(ph)}" value="${esc(x[f])}" data-f="${f}" data-id="${id}"></div>`;
}
function htmlArte(a) {
  const x = estDe(a.id), q = qtdArte(x), aberta = S.aberto === a.id;
  return `<div class="arte-card${q ? ' preenchida' : ''}${aberta ? ' aberta' : ''}" data-card="${a.id}">
    <button class="arte-trigger" data-acao="abrir" data-id="${a.id}" aria-expanded="${aberta}">${htmlTrigger(a, x)}</button>
    <div class="arte-editor">
      <span class="rotulo acento">Quantidades</span>
      <div class="qtd-grid">${TAM.map(t => stepper('arte', a.id, t, x[t])).join('')}</div>
      <p class="custo-nota">${textoCusto(custoArte(x), q)}</p>

      <label class="rotulo acento" for="papel-${a.id}">Papel</label>
      <select class="campo" id="papel-${a.id}" data-f="papel" data-id="${a.id}">${opcoesPapel(x.papel, true)}</select>
      ${x.papel === '__outro' ? `<input class="campo" type="text" placeholder="Especificar papel…" value="${esc(x.papelTexto)}" data-f="papelTexto" data-id="${a.id}">` : ''}

      <button class="switch-linha" role="switch" aria-checked="${x.usoUnico}" data-acao="uso" data-id="${a.id}">
        <span><span class="uso-lbl">Pedido de cliente específico</span><span class="uso-sub">Uso único — não repor no estoque</span></span>
        <span class="switch${x.usoUnico ? ' on' : ''}"></span>
      </button>
      ${x.usoUnico ? `<div class="uu">
        ${campoUU('Nome do cliente', 'clienteNome', x, 'ex: Maria Fernanda', 'text', a.id)}
        ${campoUU('Nome do arquivo', 'clienteArquivo', x, 'arte_alta_cliente.tif', 'text', a.id)}
        ${campoUU('Link Drive', 'clienteLink', x, 'https://drive.google.com/…', 'url', a.id)}
      </div>` : ''}

      <div class="acoes">
        <button class="btn-primario" data-acao="fechar">Confirmar ✓</button>
        <button class="btn-sec" data-acao="limpar" data-id="${a.id}">Limpar</button>
        ${a.novaArte ? `<button class="btn-sec perigo" data-acao="remover-arte" data-id="${a.id}">Remover arte</button>` : ''}
      </div>
    </div>
  </div>`;
}
function renderArtes() {
  const f = S.filtro.trim().toLowerCase();
  const casa = a => !f || `${a.nome} ${a.versao}`.toLowerCase().includes(f);
  const unicas = S.artes.filter(a => a.novaArte && casa(a));
  const padrao = S.artes.filter(a => !a.novaArte && casa(a));
  const preenchidasPadrao = S.artes.filter(a => !a.novaArte && qtdArte(estDe(a.id)) > 0).length;
  $('lista-unicas').innerHTML = unicas.map(htmlArte).join('')
    || '<p class="vazio-lista">Nenhum pedido único. Use “Nova arte” para criar um.</p>';
  $('lista-padrao').innerHTML = padrao.map(htmlArte).join('') || '<p class="vazio-lista">Nenhuma arte encontrada.</p>';
  $('contagem-unicas').textContent = `${S.artes.filter(a => a.novaArte).length}`;
  $('contagem-padrao').textContent = `${S.artes.filter(a => !a.novaArte).length} artes · ${preenchidasPadrao} preenchidas`;
  if (f) $('gaveta').open = true;
}
function atualizarCard(id) {
  const a = S.artes.find(x => x.id === id), el = document.querySelector(`[data-card="${id}"]`);
  if (!a || !el) return;
  const x = estDe(id);
  el.classList.toggle('preenchida', qtdArte(x) > 0);
  el.querySelector('.arte-trigger').innerHTML = htmlTrigger(a, x);
  el.querySelector('.custo-nota').textContent = textoCusto(custoArte(x), qtdArte(x));
}

/* ── HTML: posters ── */
function htmlPoster(p) {
  const aberto = S.posterAberto === String(p.id);
  const mes = p.mes != null ? MESES[p.mes] : null;
  const q = qtdPoster(p);
  const varLbl = p.variante === 'com' ? 'c/ endereços' : p.variante === 'sem' ? 's/ endereços' : '';
  const c = custoPoster(p);
  const completo = mes && p.variante && p.papel && q > 0;
  let resumo;
  if (!mes) resumo = 'Toque para configurar';
  else if (!p.variante) resumo = `${mes} · escolha a variante`;
  else resumo = `${mes} · ${varLbl}` + (q ? ' · ' + ['a3','a2','a1'].filter(t => p[t]).map(t => `${p[t]}×${t.toUpperCase()}`).join(' · ') : '')
    + (c.valor ? ' · ' + fmtBRL(c.valor) : '');
  return `<div class="arte-card${completo ? ' preenchida' : ''}${aberto ? ' aberta' : ''}" data-poster="${p.id}">
    <button class="arte-trigger" data-acao="poster-abrir" data-id="${p.id}" aria-expanded="${aberto}">
      <span class="trig-esq">
        <span class="arte-nome">Predinho do Dia${mes ? ` <span class="pill">${mes}</span>` : ''}${p.variante ? ` <span class="pill">${varLbl}</span>` : ''}</span>
        <span class="arte-resumo">${completo ? `<span class="qtd">${esc(resumo)}</span>` : esc(resumo)}</span>
      </span>
      <span class="trig-dir"><span class="check">${completo ? '✓' : ''}</span><span class="seta" aria-hidden="true">▾</span></span>
    </button>
    <div class="arte-editor">
      <span class="rotulo acento">Mês</span>
      <div class="mes-grid">${MESES.map((m, i) => `<button class="mes-btn" aria-pressed="${p.mes === i}" data-acao="poster-mes" data-id="${p.id}" data-v="${i}">${m}</button>`).join('')}</div>

      <span class="rotulo acento">Variante</span>
      <div class="variante-row">
        <button class="var-btn" aria-pressed="${p.variante === 'com'}" data-acao="poster-var" data-id="${p.id}" data-v="com">Com endereços<small>logradouro impresso</small></button>
        <button class="var-btn" aria-pressed="${p.variante === 'sem'}" data-acao="poster-var" data-id="${p.id}" data-v="sem">Sem endereços<small>somente arte</small></button>
      </div>

      <span class="rotulo acento">Papel</span>
      <select class="campo" data-pid="${p.id}" aria-label="Papel do poster">${opcoesPapel(p.papel, false)}</select>

      <span class="rotulo acento">Quantidades</span>
      <div class="qtd-grid">${['a3','a2','a1'].map(t => stepper('poster', p.id, t, p[t])).join('')}</div>
      <p class="custo-nota">${textoCusto(c, q)}</p>

      <div class="acoes">
        <button class="btn-primario" data-acao="poster-fechar">Confirmar ✓</button>
        <button class="btn-sec perigo" data-acao="poster-remover" data-id="${p.id}">Remover</button>
      </div>
    </div>
  </div>`;
}
function renderPosters() {
  $('lista-posters').innerHTML = S.posters.map(htmlPoster).join('');
}

/* ── totais e renderização geral ── */
function atualizarTotais() {
  const {t, total, itens, custo} = calcular();
  ['a6','a5','a4','a3','a2','a1'].forEach(k => $('tot-' + k).textContent = t[k]);
  $('tot-total').textContent = total;
  $('tot-custo').textContent = fmtBRL(custo.valor);
  $('custo-nota').textContent = custo.semPreco
    ? `${custo.semPreco} print(s) sem preço na tabela (A6, A5 ou papel sem tabela). Não entram no custo.` : '';
  $('totais').classList.toggle('visivel', total > 0);
  $('fab').classList.toggle('visivel', total > 0);
  const c = $('topo-contador');
  c.style.display = total ? 'block' : 'none';
  c.innerHTML = `<strong>${total}</strong> prints · ${itens} ${itens === 1 ? 'item' : 'itens'}`;
  $('btn-repetir').classList.toggle('hide', !S.ultimo);
}
function renderTudo() {
  $('nome-pedido').value = S.nome;
  renderArtes();
  renderPosters();
  atualizarTotais();
}
function atualizarValor(ctx, id, t) {
  if (ctx === 'arte') {
    atualizarCard(id);
    const inp = document.querySelector(`input[data-qtd][data-ctx="arte"][data-id="${id}"][data-t="${t}"]`);
    if (inp) inp.value = estDe(id)[t];
  } else {
    renderPosters();
  }
  atualizarTotais();
  salvar();
}
function passo(ctx, id, t, d) {
  if (ctx === 'arte') {
    const x = estDe(id);
    x[t] = Math.max(0, (x[t] || 0) + d);
  } else {
    const p = getPoster(id);
    if (!p) return;
    p[t] = Math.max(0, (p[t] || 0) + d);
  }
  atualizarValor(ctx, id, t);
}

/* ── ações sobre artes ── */
function limparArte(id) {
  if (qtdArte(estDe(id)) && !confirm('Limpar quantidades, papel e dados de uso único desta arte?')) return;
  S.est[id] = vazio();
  renderArtes(); atualizarTotais(); salvar();
}
function removerArte(id) {
  const a = S.artes.find(x => x.id === id);
  if (!a) return;
  if (qtdArte(estDe(id)) && !confirm(`Remover "${a.nome} ${a.versao}" da lista?`)) return;
  S.artes = S.artes.filter(x => x.id !== id);
  delete S.est[id];
  S.aberto = null;
  renderArtes(); atualizarTotais(); salvar();
}
function toggleNova(on) {
  $('nova-form').classList.toggle('aberta', on);
  document.querySelector('[data-acao="nova-abrir"]').classList.toggle('hide', on);
  if (on) $('nova-nome').focus();
}
function novaArte() {
  const nome = $('nova-nome').value.trim();
  const versao = $('nova-versao').value.trim() || 'A';
  if (!nome) { $('nova-nome').focus(); return; }
  const id = 'n' + Date.now();
  S.artes.push({id, nome, versao, novaArte: true});
  S.est[id] = {...vazio(), usoUnico: true}; // pedido único já nasce com uso único
  S.aberto = id;
  $('nova-nome').value = ''; $('nova-versao').value = '';
  toggleNova(false);
  renderArtes(); atualizarTotais(); salvar();
  scrollPara(`[data-card="${id}"]`);
}

/* ── ações sobre posters ── */
function posterNovo() {
  const p = {id: Date.now(), mes: null, variante: null, papel: '', a3: 0, a2: 0, a1: 0};
  S.posters.push(p);
  S.posterAberto = String(p.id);
  renderPosters(); atualizarTotais(); salvar();
  scrollPara(`[data-poster="${p.id}"]`);
}
function removerPoster(id) {
  const p = getPoster(id);
  if (!p) return;
  if (qtdPoster(p) && !confirm('Remover este poster do pedido?')) return;
  S.posters = S.posters.filter(x => String(x.id) !== String(id));
  if (String(S.posterAberto) === String(id)) S.posterAberto = null;
  renderPosters(); atualizarTotais(); salvar();
}

/* ── pedido: novo, repetir, validar, mensagem, enviar ── */
function temConteudo() { return calcular().total > 0 || S.nome.trim() !== ''; }
function novo() {
  if (temConteudo() && !confirm('Começar um novo pedido? O pedido atual será apagado.')) return;
  S = Object.assign(novoPedido(), {artes: S.artes, ultimo: S.ultimo});
  renderTudo(); salvar();
}
function repetir() {
  if (!S.ultimo) return;
  if (temConteudo() && !confirm('Substituir o pedido atual pelo último enviado?')) return;
  S.est = S.ultimo.est;
  S.posters = S.ultimo.posters.map((p, i) => ({...p, id: Date.now() + i}));
  S.aberto = null; S.posterAberto = null;
  renderTudo(); salvar();
}
function validar() {
  const erros = [];
  if (!calcular().total) erros.push('Nenhuma quantidade informada.');
  S.artes.forEach(a => {
    const x = estDe(a.id);
    if (!qtdArte(x)) return;
    const nome = `${a.nome} ${a.versao}`;
    if (!papelDe(x)) erros.push(`${nome}: falta escolher o papel.`);
    if (x.usoUnico && !x.clienteNome.trim()) erros.push(`${nome}: uso único sem nome do cliente.`);
  });
  S.posters.forEach(p => {
    if (!qtdPoster(p)) return;
    if (p.mes == null) erros.push('Poster: falta escolher o mês.');
    if (!p.variante) erros.push('Poster: falta escolher a variante (com ou sem endereços).');
    if (!p.papel) erros.push('Poster: falta escolher o papel.');
  });
  return erros;
}
function montarMensagem() {
  const nome = S.nome.trim() || 'Pedido';
  const hoje = new Date().toLocaleDateString('pt-BR', {day: '2-digit', month: 'long', year: 'numeric'});
  const L = [`🖨 *${nome}*`, `_${hoje}_`, ''];

  const artes = S.artes.filter(a => qtdArte(estDe(a.id)) > 0);
  if (artes.length) {
    L.push('*ARTES*');
    artes.forEach(a => {
      const x = estDe(a.id);
      const q = TAM.filter(t => x[t]).map(t => `${x[t]}×${t.toUpperCase()}`).join(', ');
      const papel = papelDe(x);
      L.push(`• *${a.nome} ${a.versao}*: ${q}${papel ? ' — ' + papel : ''}`);
      if (x.usoUnico) {
        L.push(`  ↳ _Uso único${x.clienteNome ? ' · ' + x.clienteNome : ''}_`);
        if (x.clienteArquivo) L.push(`  ↳ Arquivo: ${x.clienteArquivo}`);
        if (x.clienteLink) L.push(`  ↳ ${x.clienteLink}`);
      }
    });
    L.push('');
  }

  const posters = S.posters.filter(p => qtdPoster(p) > 0);
  if (posters.length) {
    L.push('*POSTERS · PREDINHO DO DIA*');
    posters.forEach(p => {
      const mes = p.mes != null ? MESES_LONGOS[p.mes] : '(mês não definido)';
      const v = p.variante === 'com' ? 'com endereços' : p.variante === 'sem' ? 'sem endereços' : '(variante não definida)';
      const q = ['a3','a2','a1'].filter(t => p[t]).map(t => `${p[t]}×${t.toUpperCase()}`).join(', ');
      L.push(`• *${mes}* (${v}): ${q}${p.papel ? ' — ' + p.papel : ''}`);
    });
    L.push('');
  }

  const {t, total} = calcular();
  L.push(`*TOTAL: ${total} prints*`);
  const det = ['a6','a5','a4','a3','a2','a1'].filter(k => t[k]).map(k => `${t[k]}×${k.toUpperCase()}`).join(' · ');
  if (det) L.push(det);
  return L.join('\n');
}
function abrirRevisao() {
  const erros = validar();
  $('erros').classList.toggle('hide', !erros.length);
  $('erros').innerHTML = erros.length
    ? `<strong>Corrija antes de enviar:</strong><ul>${erros.map(e => `<li>${esc(e)}</li>`).join('')}</ul>` : '';
  $('msg').textContent = montarMensagem();
  $('btn-enviar').disabled = erros.length > 0;
  $('revisao').showModal();
}
async function copiar(btn) {
  try {
    await navigator.clipboard.writeText($('msg').textContent);
    btn.textContent = 'Copiado ✓';
  } catch (_) {
    const r = document.createRange();
    r.selectNodeContents($('msg'));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    btn.textContent = 'Selecione e copie';
  }
  setTimeout(() => btn.textContent = 'Copiar texto', 2000);
}
function enviar() {
  if (validar().length) return;
  const msg = montarMensagem();
  S.ultimo = {
    est: Object.fromEntries(S.artes.filter(a => qtdArte(estDe(a.id)) > 0).map(a => [a.id, estDe(a.id)])),
    posters: S.posters.filter(p => qtdPoster(p) > 0).map(({id, ...rest}) => rest)
  };
  salvar();
  $('revisao').close();
  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`, '_blank');
  renderTudo();
}

/* ── utilidades ── */
function scrollPara(sel) {
  setTimeout(() => document.querySelector(sel)?.scrollIntoView({behavior: 'smooth', block: 'center'}), 80);
}

/* ── eventos (delegação) ── */
function acao(nome, el) {
  const id = el.dataset.id;
  switch (nome) {
    case 'abrir':
      S.aberto = S.aberto === id ? null : id;
      renderArtes(); salvar();
      if (S.aberto) scrollPara(`[data-card="${id}"]`);
      break;
    case 'fechar': S.aberto = null; renderArtes(); salvar(); break;
    case 'uso': { const x = estDe(id); x.usoUnico = !x.usoUnico; renderArtes(); salvar(); break; }
    case 'limpar': limparArte(id); break;
    case 'remover-arte': removerArte(id); break;
    case 'nova-abrir': toggleNova(true); break;
    case 'nova-cancelar': toggleNova(false); break;
    case 'nova-confirmar': novaArte(); break;
    case 'poster-novo': posterNovo(); break;
    case 'poster-abrir':
      S.posterAberto = String(S.posterAberto) === id ? null : id;
      renderPosters(); salvar();
      if (S.posterAberto) scrollPara(`[data-poster="${id}"]`);
      break;
    case 'poster-fechar': S.posterAberto = null; renderPosters(); salvar(); break;
    case 'poster-mes': getPoster(id).mes = +el.dataset.v; renderPosters(); salvar(); break;
    case 'poster-var': getPoster(id).variante = el.dataset.v; renderPosters(); salvar(); break;
    case 'poster-remover': removerPoster(id); break;
    case 'repetir': repetir(); break;
    case 'novo': novo(); break;
    case 'revisar': abrirRevisao(); break;
    case 'fechar-revisao': $('revisao').close(); break;
    case 'copiar': copiar(el); break;
    case 'enviar': enviar(); break;
  }
}

// Segurar o + ou − repete o ajuste (toque e mouse)
let rep = null;
function pararRep() { if (rep) { clearTimeout(rep.t); clearInterval(rep.i); rep = null; } }
document.addEventListener('pointerdown', ev => {
  const b = ev.target.closest('.step-btn');
  if (!b) return;
  ev.preventDefault();
  pararRep();
  const f = () => passo(b.dataset.ctx, b.dataset.id, b.dataset.t, +b.dataset.passo);
  f();
  rep = {t: setTimeout(() => { rep.i = setInterval(f, 90); }, 400)};
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(n => document.addEventListener(n, pararRep, true));

document.addEventListener('click', ev => {
  const st = ev.target.closest('.step-btn');
  if (st) {
    // detail === 0 é clique por teclado; toque e mouse já tratados no pointerdown
    if (ev.detail === 0) passo(st.dataset.ctx, st.dataset.id, st.dataset.t, +st.dataset.passo);
    return;
  }
  const el = ev.target.closest('[data-acao]');
  if (el) acao(el.dataset.acao, el);
});

document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.hasAttribute('data-qtd')) {
    const v = Math.max(0, parseInt(t.value, 10) || 0);
    const {ctx, id} = t.dataset;
    if (ctx === 'arte') estDe(id)[t.dataset.t] = v;
    else { const p = getPoster(id); if (p) p[t.dataset.t] = v; }
    atualizarValor(ctx, id, t.dataset.t);
    return;
  }
  if (t.dataset.pid) {
    const p = getPoster(t.dataset.pid);
    if (p) p.papel = t.value;
    renderPosters(); atualizarTotais(); salvar();
    return;
  }
  if (t.dataset.f === 'papel') {
    const x = estDe(t.dataset.id);
    x.papel = t.value;
    renderArtes(); atualizarTotais(); salvar();
  }
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'nome-pedido') { S.nome = t.value; salvar(); return; }
  if (t.id === 'busca') { S.filtro = t.value; renderArtes(); return; }
  if (t.dataset.f && t.dataset.id) {
    estDe(t.dataset.id)[t.dataset.f] = t.value;
    if (t.dataset.f === 'papelTexto') { atualizarCard(t.dataset.id); atualizarTotais(); }
    salvar();
  }
});

/* ── inicialização ── */
(function init() {
  const h = new Date();
  $('topo-data').textContent = h.toLocaleDateString('pt-BR', {day: 'numeric', month: 'short', year: 'numeric'});
  const dd = String(h.getDate()).padStart(2, '0'), mm = String(h.getMonth() + 1).padStart(2, '0');
  $('nome-pedido').placeholder = `Reposição ${dd}/${mm}`;
  renderTudo();
})();
</script>
</body>
</html>
